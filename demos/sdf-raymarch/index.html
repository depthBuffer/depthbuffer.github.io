<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDF Raymarching Playground — depthBuffer</title>
  <meta name="description" content="Interactive WebGL2 sphere tracer with smooth CSG, soft shadows and depth, normal and step-count debug views.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="/assets/css/demo.css">
  <script src="/assets/js/demo-kit.js"></script>
</head>
<body>
  <canvas class="demo" id="gl" aria-label="Raymarched scene. Drag to orbit, scroll to zoom."></canvas>

  <aside class="demo-panel">
    <header>
      <h1>SDF Raymarching</h1>
      <span class="demo-fps" id="fps">– fps</span>
    </header>
    <p class="demo-hint"><a class="demo-back" href="/demos.html">&larr; demos</a> · drag to orbit · scroll to zoom</p>
    <details open>
      <summary>Controls</summary>
      <div class="controls">
        <label>View
          <select id="view">
            <option value="0">Shaded</option>
            <option value="1">Depth (iso-contours)</option>
            <option value="2">Normals</option>
            <option value="3">Step count heatmap</option>
          </select>
        </label>
        <label><span>Blend radius k <output for="k"></output></span>
          <input type="range" id="k" min="0" max="1" step="0.01" value="0.45">
        </label>
        <label><span>Shadow hardness <output for="shadow"></output></span>
          <input type="range" id="shadow" min="2" max="48" step="1" value="12">
        </label>
        <label><span>Max march steps <output for="steps"></output></span>
          <input type="range" id="steps" min="8" max="256" step="1" value="128">
        </label>
        <label><span>Resolution scale <output for="scale"></output></span>
          <input type="range" id="scale" min="0.25" max="1" step="0.05" value="1">
        </label>
        <button type="button" id="pause">Pause animation</button>
      </div>
    </details>
  </aside>

  <script>
  (function () {
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl2", { antialias: false });
    if (!gl) {
      DemoKit.showError("WebGL2 not available", "This demo needs WebGL2. Try a recent version of Chrome, Edge, Firefox or Safari.");
      return;
    }

    const VS = `#version 300 es
    void main() {
      vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
      gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
    }`;

    const FS = `#version 300 es
    precision highp float;
    uniform vec2 uRes;
    uniform float uTime;
    uniform vec3 uCamPos;
    uniform float uK;
    uniform float uShadowK;
    uniform int uMaxSteps;
    uniform int uView;
    out vec4 outColor;

    const float FAR = 40.0;

    mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

    float smin(float a, float b, float k) {
      k = max(k, 1e-4);
      float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
      return mix(b, a, h) - k * h * (1.0 - h);
    }

    float sdTorus(vec3 p, vec2 t) { return length(vec2(length(p.xz) - t.x, p.y)) - t.y; }
    float sdRoundBox(vec3 p, vec3 b, float r) {
      vec3 q = abs(p) - b + r;
      return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0) - r;
    }

    // x = distance, y = material id
    vec2 map(vec3 p) {
      float t = uTime;
      vec3 q = p - vec3(0.0, 0.3, 0.0);
      q.yz *= rot(0.8);
      q.xz *= rot(t * 0.3);
      float d = sdTorus(q, vec2(1.1, 0.32));

      vec3 bp = p - vec3(0.0, 0.25 + 0.15 * sin(t * 0.8), 0.0);
      bp.xz *= rot(-t * 0.4);
      bp.xy *= rot(t * 0.25);
      d = smin(d, sdRoundBox(bp, vec3(0.42), 0.08), uK);

      d = smin(d, length(p - vec3(sin(t * 0.7) * 1.6, 0.4 + 0.5 * sin(t * 1.1), cos(t * 0.7) * 1.6)) - 0.45, uK);
      d = smin(d, length(p - vec3(cos(t * 0.5) * 0.9, 1.1 + 0.3 * cos(t * 0.9), sin(t * 0.5) * 0.9)) - 0.3, uK);

      float ground = p.y + 1.0;
      return ground < d ? vec2(ground, 1.0) : vec2(d, 0.0);
    }

    vec3 calcNormal(vec3 p) {
      const vec2 k = vec2(1.0, -1.0);
      const float e = 0.0008;
      return normalize(k.xyy * map(p + k.xyy * e).x + k.yyx * map(p + k.yyx * e).x +
                       k.yxy * map(p + k.yxy * e).x + k.xxx * map(p + k.xxx * e).x);
    }

    float softShadow(vec3 ro, vec3 rd) {
      float res = 1.0, t = 0.02;
      for (int i = 0; i < 64; i++) {
        float h = map(ro + rd * t).x;
        res = min(res, uShadowK * h / t);
        t += clamp(h, 0.01, 0.3);
        if (res < 0.002 || t > 12.0) break;
      }
      return clamp(res, 0.0, 1.0);
    }

    float ambientOcclusion(vec3 p, vec3 n) {
      float occ = 0.0, w = 1.0;
      for (int i = 1; i <= 5; i++) {
        float h = 0.03 + 0.12 * float(i);
        occ += (h - map(p + n * h).x) * w;
        w *= 0.7;
      }
      return clamp(1.0 - 1.8 * occ, 0.0, 1.0);
    }

    vec3 heat(float x) { // compact blue -> cyan -> yellow -> red ramp
      return clamp(vec3(1.5 * x - 0.2, sin(3.14159 * x), 1.0 - 1.6 * x), 0.0, 1.0);
    }

    void main() {
      vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;
      vec3 ro = uCamPos;
      vec3 ww = normalize(vec3(0.0, 0.2, 0.0) - ro);
      vec3 uu = normalize(cross(ww, vec3(0.0, 1.0, 0.0)));
      vec3 vv = cross(uu, ww);
      vec3 rd = normalize(uv.x * uu + uv.y * vv + 1.8 * ww);

      float t = 0.0;
      float mat = -1.0;
      int steps = 0;
      for (int i = 0; i < 256; i++) {
        if (i >= uMaxSteps) break;
        steps = i + 1;
        vec2 h = map(ro + rd * t);
        if (h.x < 0.0005 * t) { mat = h.y; break; }
        t += h.x;
        if (t > FAR) break;
      }
      bool hit = mat >= 0.0;

      vec3 sky = mix(vec3(0.05, 0.06, 0.09), vec3(0.11, 0.14, 0.2), clamp(rd.y * 0.5 + 0.5, 0.0, 1.0));
      vec3 col = sky;

      if (uView == 3) {
        col = heat(float(steps) / float(uMaxSteps));
      } else if (hit) {
        vec3 p = ro + rd * t;
        vec3 n = calcNormal(p);
        if (uView == 2) {
          col = n * 0.5 + 0.5;
        } else if (uView == 1) {
          float z = t * 2.0;
          float f = fract(z);
          float line = 1.0 - smoothstep(0.0, fwidth(z) * 1.2, min(f, 1.0 - f));
          float g = 1.0 - smoothstep(1.0, 14.0, t);
          vec3 ink = mix(vec3(0.37, 0.89, 1.0), vec3(1.0, 0.37, 0.64), smoothstep(3.0, 10.0, t));
          col = vec3(g * 0.35) + ink * line;
        } else {
          vec3 l = normalize(vec3(0.6, 0.85, 0.35));
          vec3 hv = normalize(l - rd);
          vec3 albedo = mat > 0.5
            ? mix(vec3(0.16), vec3(0.24), mod(floor(p.x) + floor(p.z), 2.0))
            : vec3(0.85, 0.42, 0.25);
          float diff = max(dot(n, l), 0.0) * softShadow(p + n * 0.002, l);
          float spec = pow(max(dot(n, hv), 0.0), 48.0) * diff;
          float ao = ambientOcclusion(p, n);
          float skyL = clamp(0.5 + 0.5 * n.y, 0.0, 1.0) * ao;
          col = albedo * (vec3(1.0, 0.95, 0.85) * diff * 1.4 + vec3(0.25, 0.35, 0.5) * skyL * 0.6) + spec * 0.6;
          col = mix(col, sky, 1.0 - exp(-0.0025 * t * t));
        }
      }

      if (uView == 0) col = pow(col, vec3(1.0 / 2.2)); // gamma for the shaded view only
      outColor = vec4(col, 1.0);
    }`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }

    const prog = gl.createProgram();
    try {
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    } catch (err) {
      console.error(err);
      DemoKit.showError("Shader failed to compile", "Details are in the browser console.");
      return;
    }
    gl.useProgram(prog);
    gl.bindVertexArray(gl.createVertexArray());

    const U = {};
    ["uRes", "uTime", "uCamPos", "uK", "uShadowK", "uMaxSteps", "uView"].forEach((n) => (U[n] = gl.getUniformLocation(prog, n)));

    // ---- Controls ----
    const state = { k: 0.45, shadowK: 12, maxSteps: 128, view: 0, scale: 1, paused: false };
    DemoKit.bindRange("k", (v) => (state.k = v));
    DemoKit.bindRange("shadow", (v) => (state.shadowK = v));
    DemoKit.bindRange("steps", (v) => (state.maxSteps = v));
    DemoKit.bindRange("scale", (v) => (state.scale = v));
    document.getElementById("view").addEventListener("change", (e) => (state.view = +e.target.value));
    const pauseBtn = document.getElementById("pause");
    pauseBtn.addEventListener("click", () => {
      state.paused = !state.paused;
      pauseBtn.textContent = state.paused ? "Resume animation" : "Pause animation";
    });

    // ---- Orbit camera ----
    const cam = { yaw: 0.6, pitch: 0.32, dist: 6.0 };
    let drag = null;
    canvas.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointermove", (e) => {
      if (!drag) return;
      cam.yaw -= (e.clientX - drag.x) * 0.006;
      cam.pitch = Math.min(1.45, Math.max(-0.05, cam.pitch + (e.clientY - drag.y) * 0.006));
      drag = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener("pointerup", () => (drag = null));
    canvas.addEventListener("pointercancel", () => (drag = null));
    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      cam.dist = Math.min(18, Math.max(2.5, cam.dist * Math.exp(e.deltaY * 0.001)));
    }, { passive: false });

    // ---- Loop ----
    const tickFps = DemoKit.fpsCounter(document.getElementById("fps"));
    let time = 0;
    let last = performance.now();

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      if (!state.paused) time += dt;

      const dpr = Math.min(window.devicePixelRatio || 1, 2) * state.scale;
      const w = Math.max(1, Math.round(canvas.clientWidth * dpr));
      const h = Math.max(1, Math.round(canvas.clientHeight * dpr));
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);

      const cp = Math.cos(cam.pitch);
      gl.uniform2f(U.uRes, w, h);
      gl.uniform1f(U.uTime, time);
      gl.uniform3f(U.uCamPos, Math.sin(cam.yaw) * cp * cam.dist, 0.2 + Math.sin(cam.pitch) * cam.dist, Math.cos(cam.yaw) * cp * cam.dist);
      gl.uniform1f(U.uK, state.k);
      gl.uniform1f(U.uShadowK, state.shadowK);
      gl.uniform1i(U.uMaxSteps, state.maxSteps);
      gl.uniform1i(U.uView, state.view);
      gl.drawArrays(gl.TRIANGLES, 0, 3);

      tickFps();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
