<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebGPU Compute Particles — depthBuffer</title>
  <meta name="description" content="Hundreds of thousands of particles simulated in a WGSL compute shader and rendered with instanced additive quads.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="/assets/css/demo.css">
  <script src="/assets/js/demo-kit.js"></script>
</head>
<body>
  <canvas class="demo" id="gpu" aria-label="Particle simulation. Move or drag the pointer to steer the attractor."></canvas>

  <aside class="demo-panel">
    <header>
      <h1>WebGPU Particles</h1>
      <span class="demo-fps" id="fps">– fps</span>
    </header>
    <p class="demo-hint"><a class="demo-back" href="/demos.html">&larr; demos</a> · hold the pointer down to steer</p>
    <details open>
      <summary>Controls</summary>
      <div class="controls">
        <label>Particles
          <select id="count">
            <option value="16384">16,384</option>
            <option value="65536" selected>65,536</option>
            <option value="262144">262,144</option>
          </select>
        </label>
        <label><span>Attraction <output for="attract"></output></span>
          <input type="range" id="attract" min="0" max="3" step="0.05" value="1">
        </label>
        <label><span>Swirl <output for="swirl"></output></span>
          <input type="range" id="swirl" min="-2" max="2" step="0.05" value="0.8">
        </label>
        <label><span>Particle size <output for="size"></output></span>
          <input type="range" id="size" min="0.5" max="4" step="0.25" value="1.5">
        </label>
        <button type="button" id="reset">Reset</button>
      </div>
    </details>
  </aside>

  <script type="module">
    const canvas = document.getElementById("gpu");

    if (!("gpu" in navigator)) {
      DemoKit.showError("WebGPU not available",
        "This demo needs WebGPU. Try a recent Chrome or Edge on desktop, Chrome on Android, or Safari 26+. In Firefox, WebGPU may need to be enabled.");
      throw new Error("WebGPU unsupported");
    }

    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
      DemoKit.showError("No GPU adapter", "Your browser supports WebGPU but couldn't find a suitable GPU adapter. Hardware acceleration may be disabled.");
      throw new Error("No adapter");
    }
    const device = await adapter.requestDevice();
    device.lost.then((info) => {
      if (info.reason !== "destroyed") DemoKit.showError("GPU device lost", info.message || "The GPU device was lost.");
    });

    const ctx = canvas.getContext("webgpu");
    const format = navigator.gpu.getPreferredCanvasFormat();
    ctx.configure({ device, format, alphaMode: "opaque" });

    // ---- Shaders ----
    const common = /* wgsl */ `
      struct Particle { pos: vec2f, vel: vec2f };
      struct Params {
        dt: f32, time: f32, mouse: vec2f,
        aspect: f32, attract: f32, swirl: f32, size: f32,
        pixel: f32, _pad0: f32, _pad1: f32, _pad2: f32,
      };
    `;

    const computeWGSL = common + /* wgsl */ `
      @group(0) @binding(0) var<storage, read_write> particles: array<Particle>;
      @group(0) @binding(1) var<uniform> P: Params;

      @compute @workgroup_size(64)
      fn main(@builtin(global_invocation_id) id: vec3u) {
        let i = id.x;
        if (i >= arrayLength(&particles)) { return; }
        var p = particles[i];

        let d = P.mouse - p.pos;
        let r2 = dot(d, d) + 0.02;
        let dir = d * inverseSqrt(r2);
        var acc = dir * (P.attract * 0.6 / r2);                 // inverse-square pull
        acc += vec2f(-dir.y, dir.x) * (P.swirl * 0.5 / sqrt(r2)); // tangential swirl

        p.vel = (p.vel + acc * P.dt) * exp(-0.6 * P.dt);
        let speed = length(p.vel);
        if (speed > 4.0) { p.vel *= 4.0 / speed; }
        p.pos += p.vel * P.dt;

        // Wrap around the visible area.
        let ext = vec2f(P.aspect, 1.0) * 1.05;
        p.pos = select(p.pos, -p.pos * 0.98, abs(p.pos) > ext);

        particles[i] = p;
      }
    `;

    const renderWGSL = common + /* wgsl */ `
      @group(0) @binding(0) var<storage, read> particles: array<Particle>;
      @group(0) @binding(1) var<uniform> P: Params;

      struct VOut {
        @builtin(position) pos: vec4f,
        @location(0) uv: vec2f,
        @location(1) speed: f32,
      };

      @vertex
      fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
        var corners = array<vec2f, 6>(
          vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(-1.0, 1.0),
          vec2f(-1.0, 1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0));
        let c = corners[vi];
        let p = particles[ii];
        let r = P.size * P.pixel; // radius in sim units, P.pixel = one CSS pixel
        var o: VOut;
        o.pos = vec4f((p.pos.x + c.x * r) / P.aspect, p.pos.y + c.y * r, 0.0, 1.0);
        o.uv = c;
        o.speed = length(p.vel);
        return o;
      }

      @fragment
      fn fs(i: VOut) -> @location(0) vec4f {
        let a = max(0.0, 1.0 - dot(i.uv, i.uv));
        let slow = vec3f(0.15, 0.55, 1.0);
        let fast = vec3f(1.0, 0.35, 0.65);
        let col = mix(slow, fast, clamp(i.speed * 0.6, 0.0, 1.0));
        return vec4f(col * a * a * 0.35, 0.0);
      }
    `;

    const computePipeline = device.createComputePipeline({
      layout: "auto",
      compute: { module: device.createShaderModule({ code: computeWGSL }), entryPoint: "main" },
    });

    const renderModule = device.createShaderModule({ code: renderWGSL });
    const renderPipeline = device.createRenderPipeline({
      layout: "auto",
      vertex: { module: renderModule, entryPoint: "vs" },
      fragment: {
        module: renderModule,
        entryPoint: "fs",
        targets: [{
          format,
          blend: {
            color: { srcFactor: "one", dstFactor: "one", operation: "add" },
            alpha: { srcFactor: "one", dstFactor: "one", operation: "add" },
          },
        }],
      },
      primitive: { topology: "triangle-list" },
    });

    // ---- Buffers ----
    const params = new Float32Array(12);
    const paramBuffer = device.createBuffer({ size: params.byteLength, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

    let count = 0, particleBuffer = null, computeBG = null, renderBG = null;

    function createParticles(n) {
      if (particleBuffer) particleBuffer.destroy();
      count = n;
      const data = new Float32Array(n * 4);
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = 0.15 + Math.sqrt(Math.random()) * 0.85;
        data[i * 4 + 0] = Math.cos(a) * r;
        data[i * 4 + 1] = Math.sin(a) * r;
        data[i * 4 + 2] = -Math.sin(a) * 0.4; // start with a gentle orbit
        data[i * 4 + 3] = Math.cos(a) * 0.4;
      }
      particleBuffer = device.createBuffer({ size: data.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
      device.queue.writeBuffer(particleBuffer, 0, data);

      const entries = [
        { binding: 0, resource: { buffer: particleBuffer } },
        { binding: 1, resource: { buffer: paramBuffer } },
      ];
      computeBG = device.createBindGroup({ layout: computePipeline.getBindGroupLayout(0), entries });
      renderBG = device.createBindGroup({ layout: renderPipeline.getBindGroupLayout(0), entries });
    }

    // ---- Controls ----
    const state = { attract: 1, swirl: 0.8, size: 1.5 };
    DemoKit.bindRange("attract", (v) => (state.attract = v));
    DemoKit.bindRange("swirl", (v) => (state.swirl = v));
    DemoKit.bindRange("size", (v) => (state.size = v));
    const countSel = document.getElementById("count");
    countSel.addEventListener("change", () => createParticles(+countSel.value));
    document.getElementById("reset").addEventListener("click", () => createParticles(+countSel.value));
    createParticles(+countSel.value);

    // ---- Pointer ----
    const pointer = { x: 0, y: 0, down: false };
    function toSim(e) {
      const rect = canvas.getBoundingClientRect();
      const aspect = rect.width / rect.height;
      pointer.x = ((e.clientX - rect.left) / rect.width * 2 - 1) * aspect;
      pointer.y = -((e.clientY - rect.top) / rect.height * 2 - 1);
    }
    canvas.addEventListener("pointerdown", (e) => { pointer.down = true; toSim(e); canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener("pointermove", (e) => { if (pointer.down) toSim(e); });
    canvas.addEventListener("pointerup", () => (pointer.down = false));
    canvas.addEventListener("pointercancel", () => (pointer.down = false));

    // ---- Loop ----
    const tickFps = DemoKit.fpsCounter(document.getElementById("fps"));
    let time = 0, last = performance.now();

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 1 / 30);
      last = now;
      time += dt;

      DemoKit.fitCanvas(canvas, 2);
      const aspect = canvas.clientWidth / Math.max(1, canvas.clientHeight);

      // When idle, the attractor traces a slow Lissajous curve.
      const mx = pointer.down ? pointer.x : Math.sin(time * 0.37) * 0.6 * aspect;
      const my = pointer.down ? pointer.y : Math.sin(time * 0.53) * 0.5;

      params.set([dt, time, mx, my, aspect, state.attract, state.swirl, state.size, 2 / Math.max(1, canvas.clientHeight), 0, 0, 0]);
      device.queue.writeBuffer(paramBuffer, 0, params);

      const enc = device.createCommandEncoder();

      const cpass = enc.beginComputePass();
      cpass.setPipeline(computePipeline);
      cpass.setBindGroup(0, computeBG);
      cpass.dispatchWorkgroups(Math.ceil(count / 64));
      cpass.end();

      const rpass = enc.beginRenderPass({
        colorAttachments: [{
          view: ctx.getCurrentTexture().createView(),
          clearValue: { r: 0.012, g: 0.014, b: 0.02, a: 1 },
          loadOp: "clear",
          storeOp: "store",
        }],
      });
      rpass.setPipeline(renderPipeline);
      rpass.setBindGroup(0, renderBG);
      rpass.draw(6, count);
      rpass.end();

      device.queue.submit([enc.finish()]);
      tickFps();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
